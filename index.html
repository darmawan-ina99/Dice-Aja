<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dadu Aja</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: Arial, sans-serif;
    background: radial-gradient(ellipse at center, #1d6b3f 0%, #0e4a29 60%, #07301b 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center;
    min-height:100vh; user-select:none; padding:8px; overflow-x:hidden;
  }

  #prediksi {
    margin:6px auto 0; min-height:34px;
    display:none; align-items:center; justify-content:center; gap:6px;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,215,0,.35);
    border-radius:12px; padding:5px 12px;
  }
  #prediksi.show { display:flex; }

  /* dadu tersusun VERTIKAL seperti referensi */
  .meja {
    margin:8px 0; width:100%;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:10px 0; min-height:80px;
  }
  .dadu { width:66px; height:66px; position:relative; }
  .dadu .kubus { position:absolute; top:0; left:0; width:100%; height:100%; }

  .muka {
    position:absolute; top:0; left:0; width:100%; height:100%;
    border-radius:12px; overflow:hidden;
    background:linear-gradient(145deg,#ffffff,#dfe6e9);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.15), 0 4px 10px rgba(0,0,0,.45);
    will-change:transform;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
  }
  .muka.angka { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:8px; }
  .muka.angka .p { border-radius:50%; background:#1a1a1a; align-self:center; justify-self:center; width:12px; height:12px; box-shadow: inset 0 1px 2px rgba(255,255,255,.35), inset 0 -1px 2px rgba(0,0,0,.5); }
  .muka.hewan { display:flex; align-items:center; justify-content:center; }
  .muka.hewan svg { width:72%; height:72%; }

  /* mini dadu (ikon jumlah & prediksi) */
  .mini { width:26px; height:26px; border-radius:6px; position:relative;
    background:linear-gradient(145deg,#ffffff,#dfe6e9);
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.15), 0 2px 5px rgba(0,0,0,.4);
    flex:0 0 auto; }
  .mini.angka { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:3px; }
  .mini.angka .p { border-radius:50%; background:#1a1a1a; align-self:center; justify-self:center; width:4.5px; height:4.5px; }
  .mini.hewan { display:flex; align-items:center; justify-content:center; }
  .mini.hewan svg { width:82%; height:82%; }
  .mini.sep { width:2px; height:22px; background:rgba(255,215,0,.4); border-radius:2px; flex:0 0 auto; }

  .ikonbar {
    margin-top:auto; display:flex; align-items:center; justify-content:center; gap:10px;
    background:rgba(0,0,0,.3); border-radius:16px; padding:8px 12px;
  }
  .ikonbar button, #btn-roll, #btn-mute, #eye {
    border:none; cursor:pointer; background:rgba(255,255,255,.16); color:#fff;
    border-radius:10px; transition:transform .15s, background .2s;
    display:flex; align-items:center; justify-content:center;
  }
  .ikonbar button { width:34px; height:34px; font-size:1em; }
  .ikonbar button:active { transform:scale(.92); background:rgba(255,255,255,.3); }
  .ikonbar .dur-btn.aktif { background:#ffd54f; }

  #btn-roll {
    margin:12px 0 8px; width:72px; height:72px; font-size:2em;
    background:linear-gradient(180deg,#ffca28,#ffb300); color:#3e2723;
    border-radius:50%; box-shadow:0 5px 14px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.5);
  }
  #btn-roll:active { transform:scale(.95); }
  #btn-roll:disabled { filter:grayscale(.6) brightness(.8); cursor:default; }

  #btn-mute { position:fixed; top:10px; right:10px; width:38px; height:38px; font-size:1em; background:rgba(0,0,0,.35); border-radius:50%; }
  #eye { position:fixed; top:10px; left:10px; width:38px; height:38px; font-size:1em; background:rgba(0,0,0,.35); border-radius:50%; opacity:.55; }
  #eye.on { opacity:1; background:#ffd54f; color:#333; }

  @media (max-height:720px){
    .meja.padat .dadu { width:52px; height:52px; }
    .meja.padat .muka.angka { padding:6px; } .meja.padat .muka.angka .p { width:9px; height:9px; }
    .meja { gap:8px; }
  }
  @media (max-height:620px){
    .dadu { width:52px; height:52px; }
    .muka.angka { padding:6px; } .muka.angka .p { width:9px; height:9px; }
    .meja { gap:7px; }
  }
</style>
</head>
<body>

<button id="eye" title="Prediksi">👁</button>
<button id="btn-mute" title="Suara">🔊</button>

<div id="prediksi"></div>

<div class="meja" id="meja"></div>

<div class="ikonbar">
  <button id="minus">−</button>
  <div class="mini angka" id="jml-ikon"></div>
  <button id="plus">+</button>
  <button class="dur-btn" data-d="2000" title="Cepat">⚡</button>
  <button class="dur-btn" data-d="4000" title="Normal">🕓</button>
  <button class="dur-btn" data-d="6500" title="Santai">🐢</button>
</div>

<button id="btn-roll">🎲</button>

<script>
(function(){
  // ============================================================
  //  ROLL ENGINE v1.4 — port setia gerakan The Dice v6.3
  //  + UI tanpa teks (ikon murni) + dadu tersusun vertikal
  //  + dadu hewan: wajah putih, hanya hewannya berwarna (SVG)
  // ============================================================
  var PIP = {
    1:[5],
    2:[1,9],
    3:[1,5,9],
    4:[1,3,7,9],
    5:[1,3,5,7,9],
    6:[1,3,4,6,7,9]
  };
  // hewan: [jenis, warna] — jenis 0=gajah 1=ayam 2=naga; warna 0=merah 1=putih
  var HEWAN = [
    [0,0],[0,1],   // Gajah Merah, Gajah Putih
    [1,0],[1,1],   // Ayam Merah, Ayam Putih
    [2,0],[2,1]    // Naga Merah, Naga Putih
  ];

  var FRAME_MS = 250;
  var EASE = 'cubic-bezier(0.42, 0, 0.58, 1)';

  var meja = document.getElementById('meja');
  var predPanel = document.getElementById('prediksi');
  var jmlIkon = document.getElementById('jml-ikon');
  var btnRoll = document.getElementById('btn-roll');
  var eyeBtn = document.getElementById('eye');

  var state = {
    jumlah: parseInt(localStorage.getItem('da_jumlah')||'2',10),
    durasi: parseInt(localStorage.getItem('da_durasi')||'4000',10),
    prediksiOn: localStorage.getItem('da_eye')==='1',
    muted: localStorage.getItem('da_mute')==='1',
    rolling: false,
    next: null
  };

  // ---------- suara ----------
  var actx = null;
  function ensureAudio(){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==='suspended') actx.resume();
  }
  function blip(freq,dur,vol,type){
    if(state.muted || !actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }
  function tickSfx(){ blip(2200,0.02,0.04,'square'); }
  function thud(){ blip(160,0.09,0.22,'sine'); }
  function gong(){ blip(520,0.35,0.18,'triangle'); }

  // ---------- SVG hewan (siluet, hanya hewan yang berwarna) ----------
  function hewanSvg(idx, mini){
    var jenis = HEWAN[idx][0], merah = HEWAN[idx][1]===0;
    var col = merah ? '#d32f2f' : '#ffffff';
    var stroke = merah ? 'none' : '#37474f';
    var eye = merah ? '#ffffff' : '#37474f';
    var bentuk = '';
    if(jenis===0){ // GAJAH
      bentuk =
        '<ellipse cx="30" cy="27" rx="12" ry="10"/>'+
        '<circle cx="13.5" cy="21" r="7.5"/>'+
        '<path d="M11 26 C5.5 28 4 36 8 41 C10.5 44 15 44 15.5 40.5 C16 38 13 38.5 11.5 36 C9.5 32.5 10.5 29.5 13 28.5 Z"/>'+
        '<circle cx="17.5" cy="18" r="4"/>'+
        '<rect x="20" y="33" width="5" height="10" rx="2"/>'+
        '<rect x="28" y="34" width="5" height="10" rx="2"/>'+
        '<rect x="36" y="33" width="5" height="10" rx="2"/>'+
        '<path d="M41 23 C45.5 24 46.5 29 44.5 33 C44 31 43.5 28.5 40.5 27.5 Z"/>'+
        '<circle cx="11.5" cy="19.5" r="1.4" fill="'+eye+'" stroke="none"/>';
    } else if(jenis===1){ // AYAM
      bentuk =
        '<ellipse cx="28" cy="31" rx="10.5" ry="8.5"/>'+
        '<path d="M36 28 C43.5 24.5 44.5 14.5 39 8.5 C40 15.5 36 19 33 21 C35 15 32 12 29 11 C33 15 32 21 30 25 Z"/>'+
        '<circle cx="17.5" cy="18" r="5.5"/>'+
        '<circle cx="20.5" cy="23.5" r="4.5"/>'+
        '<path d="M12.5 16.5 L6.5 19 L12.5 21.5 Z"/>'+
        '<circle cx="15.5" cy="12.7" r="2"/>'+
        '<circle cx="19" cy="11.8" r="2.2"/>'+
        '<rect x="25" y="38" width="2.2" height="6" rx="1.1"/>'+
        '<rect x="30" y="38" width="2.2" height="6" rx="1.1"/>'+
        '<circle cx="16.2" cy="17" r="1.3" fill="'+eye+'" stroke="none"/>';
    } else { // NAGA
      bentuk =
        '<circle cx="10" cy="36" r="5"/>'+
        '<circle cx="16" cy="39" r="5"/>'+
        '<circle cx="23" cy="38" r="5"/>'+
        '<circle cx="28.5" cy="33" r="5"/>'+
        '<circle cx="31" cy="26" r="5"/>'+
        '<circle cx="29" cy="19" r="5"/>'+
        '<circle cx="33.5" cy="13.5" r="5"/>'+
        '<ellipse cx="40" cy="10" rx="6" ry="4.6"/>'+
        '<path d="M44.5 7.5 L50 9.5 L44.5 12.5 Z"/>'+
        '<path d="M37 6.5 L35 1 L39 4 Z"/>'+
        '<path d="M43 6 L45.5 1 L41 4 Z"/>'+
        '<rect x="11" y="41" width="3" height="5" rx="1.5"/>'+
        '<rect x="21" y="41" width="3" height="5" rx="1.5"/>'+
        '<circle cx="41.5" cy="9" r="1.2" fill="'+eye+'" stroke="none"/>';
    }
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 48 48');
    svg.setAttribute('data-jenis', jenis);
    svg.setAttribute('data-warna', merah ? 'merah' : 'putih');
    if(mini) svg.setAttribute('class','mini-svg');
    svg.innerHTML = '<g fill="'+col+'" stroke="'+stroke+'" stroke-width="1.3" stroke-linejoin="round">'+bentuk+'</g>';
    return svg;
  }

  // ---------- pembangun wajah ----------
  function makeMukaAngka(n){
    var m = document.createElement('div'); m.className='muka angka';
    for(var i=1;i<=9;i++){
      var c = document.createElement('span');
      if(PIP[n].indexOf(i)>=0) c.className='p';
      m.appendChild(c);
    }
    return m;
  }
  function makeMukaHewan(idx){
    var m = document.createElement('div'); m.className='muka hewan';
    m.appendChild(hewanSvg(idx));
    return m;
  }
  function makeDadu(tipe, cur){
    var d = document.createElement('div'); d.className='dadu'; d.dataset.tipe=tipe; d.dataset.cur=cur;
    var k = document.createElement('div'); k.className='kubus';
    var awal = tipe==='hewan' ? makeMukaHewan(cur) : makeMukaAngka(cur);
    awal.classList.add('tampil');
    k.appendChild(awal);
    d.appendChild(k);
    return d;
  }
  function renderMeja(){
    meja.innerHTML='';
    meja.classList.toggle('padat', state.jumlah>=5);
    var i;
    for(i=0;i<state.jumlah;i++) meja.appendChild(makeDadu('angka', 6));
    meja.appendChild(makeDadu('hewan', 5));   // hewan "diam di 6"
    renderJmlIkon();
  }
  function renderJmlIkon(){
    jmlIkon.innerHTML='';
    for(var i=1;i<=9;i++){
      var c = document.createElement('span');
      if(PIP[state.jumlah].indexOf(i)>=0) c.className='p';
      jmlIkon.appendChild(c);
    }
  }

  // ---------- ANIMASI WAJAH (port show_right / hide_left asli) ----------
  function showFace(b, face){
    var kubus = b.el.querySelector('.kubus');
    var prev = kubus.querySelector('.muka.tampil');
    var baru = b.hewan ? makeMukaHewan(face) : makeMukaAngka(face);
    baru.classList.add('tampil');
    baru.style.transformOrigin = '100% 50%';
    baru.style.transform = 'scale(0, 0.8)';
    baru.style.transition = 'none';
    kubus.appendChild(baru);
    void baru.offsetWidth;
    baru.style.transition = 'transform ' + FRAME_MS + 'ms ' + EASE;
    baru.style.transform = 'scale(1, 1)';
    if(prev){
      prev.classList.remove('tampil');
      prev.style.transformOrigin = '0% 50%';
      prev.style.transition = 'transform ' + FRAME_MS + 'ms ' + EASE;
      prev.style.transform = 'scale(0, 0.8)';
      setTimeout(function(){
        if(prev.parentNode) prev.parentNode.removeChild(prev);
      }, FRAME_MS);
    }
    b.el.dataset.cur = face;
  }

  // ---------- prediksi (ditampilkan sebagai mini dadu, tanpa teks) ----------
  function acak(n){
    var t=[]; for(var i=0;i<n;i++) t.push(1+Math.floor(Math.random()*6));
    return t;
  }
  function genNext(){
    state.next = { nums: acak(state.jumlah), hewan: Math.floor(Math.random()*6) };
  }
  function miniAngka(n){
    var m = document.createElement('div'); m.className='mini angka';
    for(var i=1;i<=9;i++){
      var c = document.createElement('span');
      if(PIP[n].indexOf(i)>=0) c.className='p';
      m.appendChild(c);
    }
    return m;
  }
  function miniHewan(idx){
    var m = document.createElement('div'); m.className='mini hewan';
    m.appendChild(hewanSvg(idx, true));
    return m;
  }
  function refreshPrediction(){
    if(!state.next || state.next.nums.length!==state.jumlah) genNext();
    predPanel.innerHTML='';
    if(state.prediksiOn){
      state.next.nums.forEach(function(n){ predPanel.appendChild(miniAngka(n)); });
      var sep = document.createElement('div'); sep.className='mini sep';
      predPanel.appendChild(sep);
      predPanel.appendChild(miniHewan(state.next.hewan));
      predPanel.classList.add('show');
    } else {
      predPanel.classList.remove('show');
    }
  }

  // ---------- ROLL (konter global serempak) ----------
  function roll(){
    if(state.rolling) return;
    state.rolling = true;
    btnRoll.disabled = true;

    var angka, hewanIdx;
    if(state.next && state.next.nums.length===state.jumlah){
      angka = state.next.nums.slice(); hewanIdx = state.next.hewan;
    } else {
      angka = acak(state.jumlah); hewanIdx = Math.floor(Math.random()*6);
    }

    var dice = Array.prototype.slice.call(document.querySelectorAll('.dadu'));
    var balls = dice.map(function(d,i){
      return {
        el: d,
        hewan: d.dataset.tipe==='hewan',
        value: d.dataset.tipe==='hewan' ? hewanIdx : angka[i],
        cur: parseInt(d.dataset.cur,10),
        stoped: false
      };
    });

    var MIN_SPIN_MS = state.durasi===2000 ? 1500 : (state.durasi===6500 ? 5000 : 3000);
    var secCounter = 5;
    var minSpinDone = false;
    var stopWindowOpen = false;
    setTimeout(function(){ minSpinDone = true; }, MIN_SPIN_MS);

    balls.forEach(function(b){
      var diamDi6 = b.hewan ? (b.cur===5) : (b.cur===6);
      if(!diamDi6) showFace(b, b.hewan ? 5 : 6);
    });

    function tick(){
      secCounter += 1;
      if(secCounter >= 6) secCounter = 0;
      var face = secCounter + 1;

      if(!stopWindowOpen && minSpinDone && face===2) stopWindowOpen = true;

      var allNumStoped = balls.every(function(b){ return b.hewan || b.stoped; });
      var anySpinning = false;

      balls.forEach(function(b){
        if(b.stoped) return;
        if(!b.hewan){
          if(stopWindowOpen && face===b.value){
            showFace(b, face);
            b.stoped = true;
            b.el.dataset.stoped = '1';
            thud();
          } else {
            showFace(b, face);
            anySpinning = true;
          }
        } else {
          if(allNumStoped && secCounter===b.value){
            showFace(b, b.value);
            b.stoped = true;
            b.el.dataset.stoped = '1';
            gong();
          } else {
            showFace(b, secCounter);
            anySpinning = true;
          }
        }
      });
      tickSfx();

      if(anySpinning) setTimeout(tick, FRAME_MS);
      else setTimeout(selesai, FRAME_MS);
    }
    setTimeout(tick, FRAME_MS);

    function selesai(){
      genNext();
      refreshPrediction();
      state.rolling = false;
      btnRoll.disabled = false;
    }
  }

  // ---------- kontrol (ikon murni) ----------
  document.getElementById('minus').onclick = function(){ ubahJumlah(-1); };
  document.getElementById('plus').onclick  = function(){ ubahJumlah(1); };
  function ubahJumlah(d){
    if(state.rolling) return;
    state.jumlah = Math.min(6, Math.max(1, state.jumlah+d));
    localStorage.setItem('da_jumlah', state.jumlah);
    renderMeja();
    genNext(); refreshPrediction();
  }

  document.querySelectorAll('.dur-btn').forEach(function(b){
    b.onclick = function(){
      if(state.rolling) return;
      document.querySelectorAll('.dur-btn').forEach(function(x){x.classList.remove('aktif');});
      b.classList.add('aktif');
      state.durasi = parseInt(b.dataset.d,10);
      localStorage.setItem('da_durasi', state.durasi);
    };
  });

  eyeBtn.onclick = function(){
    state.prediksiOn = !state.prediksiOn;
    eyeBtn.classList.toggle('on', state.prediksiOn);
    localStorage.setItem('da_eye', state.prediksiOn?'1':'0');
    refreshPrediction();
  };

  var muteBtn = document.getElementById('btn-mute');
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  muteBtn.onclick = function(){
    state.muted = !state.muted;
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    localStorage.setItem('da_mute', state.muted?'1':'0');
  };

  btnRoll.onclick = function(){ ensureAudio(); roll(); };
  meja.addEventListener('click', function(){ ensureAudio(); roll(); });  // tap area dadu = lempar, ala referensi

  // init
  document.querySelectorAll('.dur-btn').forEach(function(b){
    b.classList.toggle('aktif', parseInt(b.dataset.d,10)===state.durasi);
  });
  eyeBtn.classList.toggle('on', state.prediksiOn);
  renderMeja();
  refreshPrediction();
})();
</script>
</body>
</html>
