<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dadu Aja</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #1d6b3f 0%, #0e4a29 60%, #07301b 100%);
    height:100vh; user-select:none; padding:8px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
  }

  .meja {
    width:100%; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center;
    padding:6px 0; overflow-y:auto;
  }
  .tumpuk { margin:auto 0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .dadu { width:66px; height:66px; position:relative; cursor:pointer; }
  .dadu .kubus { position:absolute; top:0; left:0; width:100%; height:100%; }

  .muka {
    position:absolute; top:0; left:0; width:100%; height:100%;
    border-radius:12px; overflow:hidden;
    background:linear-gradient(145deg,#ffffff,#dfe6e9);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.15), 0 4px 10px rgba(0,0,0,.45);
    will-change:transform;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
  }
  .muka.angka { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:8px; }
  .muka.angka .p { border-radius:50%; background:#1a1a1a; align-self:center; justify-self:center; width:12px; height:12px; box-shadow: inset 0 1px 2px rgba(255,255,255,.35), inset 0 -1px 2px rgba(0,0,0,.5); }
  .muka.hewan { display:flex; align-items:center; justify-content:center; }
  .muka.hewan img { width:100%; height:100%; object-fit:cover; display:block; border-radius:12px; }

  @media (max-height:760px){
    .meja.padat .dadu { width:54px; height:54px; }
    .meja.padat .muka.angka { padding:6px; } .meja.padat .muka.angka .p { width:9px; height:9px; }
    .meja .tumpuk { gap:8px; }
  }
  @media (max-height:640px){
    .dadu { width:48px; height:48px; }
    .muka.angka { padding:5px; } .muka.angka .p { width:8px; height:8px; }
    .meja .tumpuk { gap:6px; }
  }
</style>
</head>
<body>

<div class="meja" id="meja"><div class="tumpuk" id="tumpuk"></div></div>

<script>
(function(){
  // ============================================================
  //  DADU AJA v1.7
  //  - Layar BERSIH: hanya dadu, tanpa tombol dan tanpa teks.
  //  - Awal tampil 7 dadu (6 angka + 1 hewan di bawah).
  //  - TAP dadu angka ke-k -> main k dadu angka + dadu hewan,
  //    langsung dilempar. TAP dadu hewan -> main 6 angka + hewan.
  //  - Gambar hewan merah & putih: GAMBAR SAMA, hanya beda warna
  //    (versi putih = recolor piksel dari versi merah).
  //  - Gerakan tetap port setia The Dice v6.3: konter global
  //    serempak, slide wajah kanan-masuk/kiri-keluar, pembuka
  //    tanpa jeda, tempo 4 wajah/detik, urutan berhenti
  //    2-3-4-5-6-1, kembar serempak, hewan penutup + gong.
  // ============================================================
  var PIP = {
    1:[5],
    2:[1,9],
    3:[1,5,9],
    4:[1,3,7,9],
    5:[1,3,5,7,9],
    6:[1,3,4,6,7,9]
  };
  var FRAME_MS = 250;
  var EASE = 'cubic-bezier(0.42, 0, 0.58, 1)';

  var meja = document.getElementById('meja');
  var tumpuk = document.getElementById('tumpuk');

  var state = { jumlah: 6, rolling: false };

  // ---------- suara ----------
  var actx = null;
  function ensureAudio(){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==='suspended') actx.resume();
  }
  function blip(freq,dur,vol,type){
    if(!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }
  function tickSfx(){ blip(2200,0.02,0.04,'square'); }
  function thud(){ blip(160,0.09,0.22,'sine'); }
  function gong(){ blip(520,0.35,0.18,'triangle'); }

  // ---------- gambar & wajah ----------
  function hewanImg(idx){
    var im = document.createElement('img');
    im.src = 'hewan_' + idx + '.png';
    im.alt = '';
    im.setAttribute('draggable','false');
    return im;
  }
  function makeMukaAngka(n){
    var m = document.createElement('div'); m.className='muka angka';
    for(var i=1;i<=9;i++){
      var c = document.createElement('span');
      if(PIP[n].indexOf(i)>=0) c.className='p';
      m.appendChild(c);
    }
    return m;
  }
  function makeMukaHewan(idx){
    var m = document.createElement('div'); m.className='muka hewan';
    m.appendChild(hewanImg(idx));
    return m;
  }
  function makeDadu(tipe, cur){
    var d = document.createElement('div'); d.className='dadu'; d.dataset.tipe=tipe; d.dataset.cur=cur;
    var k = document.createElement('div'); k.className='kubus';
    var awal = tipe==='hewan' ? makeMukaHewan(cur) : makeMukaAngka(cur);
    awal.classList.add('tampil');
    k.appendChild(awal);
    d.appendChild(k);
    return d;
  }
  function renderMeja(){
    tumpuk.innerHTML='';
    meja.classList.toggle('padat', state.jumlah>=5);
    var i;
    for(i=0;i<state.jumlah;i++) tumpuk.appendChild(makeDadu('angka', 6));
    tumpuk.appendChild(makeDadu('hewan', 5));   // hewan "diam di 6"
  }

  // ---------- ANIMASI WAJAH (port show_right / hide_left asli) ----------
  function showFace(b, face){
    var kubus = b.el.querySelector('.kubus');
    var prev = kubus.querySelector('.muka.tampil');
    var baru = b.hewan ? makeMukaHewan(face) : makeMukaAngka(face);
    baru.classList.add('tampil');
    baru.style.transformOrigin = '100% 50%';
    baru.style.transform = 'scale(0, 0.8)';
    baru.style.transition = 'none';
    kubus.appendChild(baru);
    void baru.offsetWidth;
    baru.style.transition = 'transform ' + FRAME_MS + 'ms ' + EASE;
    baru.style.transform = 'scale(1, 1)';
    if(prev){
      prev.classList.remove('tampil');
      prev.style.transformOrigin = '0% 50%';
      prev.style.transition = 'transform ' + FRAME_MS + 'ms ' + EASE;
      prev.style.transform = 'scale(0, 0.8)';
      setTimeout(function(){
        if(prev.parentNode) prev.parentNode.removeChild(prev);
      }, FRAME_MS);
    }
    b.el.dataset.cur = face;
  }

  // ---------- ROLL (konter global serempak; hasil acak murni) ----------
  function acak(n){
    var t=[]; for(var i=0;i<n;i++) t.push(1+Math.floor(Math.random()*6));
    return t;
  }
  function roll(){
    if(state.rolling) return;
    state.rolling = true;

    var angka = acak(state.jumlah);
    var hewanIdx = Math.floor(Math.random()*6);

    var dice = Array.prototype.slice.call(document.querySelectorAll('.dadu'));
    var balls = dice.map(function(d,i){
      return {
        el: d,
        hewan: d.dataset.tipe==='hewan',
        value: d.dataset.tipe==='hewan' ? hewanIdx : angka[i],
        cur: parseInt(d.dataset.cur,10),
        stoped: false
      };
    });

    var MIN_SPIN_MS = 3000;   // asli: postDelayed 3000L
    var secCounter = 5;
    var minSpinDone = false;
    var stopWindowOpen = false;
    setTimeout(function(){ minSpinDone = true; }, MIN_SPIN_MS);

    balls.forEach(function(b){
      var diamDi6 = b.hewan ? (b.cur===5) : (b.cur===6);
      if(!diamDi6) showFace(b, b.hewan ? 5 : 6);
    });

    function tick(){
      secCounter += 1;
      if(secCounter >= 6) secCounter = 0;
      var face = secCounter + 1;

      if(!stopWindowOpen && minSpinDone && face===2) stopWindowOpen = true;

      var allNumStoped = balls.every(function(b){ return b.hewan || b.stoped; });
      var anySpinning = false;

      balls.forEach(function(b){
        if(b.stoped) return;
        if(!b.hewan){
          if(stopWindowOpen && face===b.value){
            showFace(b, face);
            b.stoped = true;
            b.el.dataset.stoped = '1';
            thud();
          } else {
            showFace(b, face);
            anySpinning = true;
          }
        } else {
          if(allNumStoped && secCounter===b.value){
            showFace(b, b.value);
            b.stoped = true;
            b.el.dataset.stoped = '1';
            gong();
          } else {
            showFace(b, secCounter);
            anySpinning = true;
          }
        }
      });
      tickSfx();

      if(anySpinning) setTimeout(tick, FRAME_MS);
      else setTimeout(selesai, FRAME_MS);
    }
    setTimeout(tick, FRAME_MS);

    function selesai(){
      state.rolling = false;
    }
  }

  // ---------- interaksi: TAP DADU = pilih jumlah + lempar ----------
  meja.addEventListener('click', function(e){
    if(state.rolling) return;
    var el = e.target.closest ? e.target.closest('.dadu') : null;
    if(!el) return;
    ensureAudio();
    var dice = document.querySelectorAll('.dadu');
    if(el.dataset.tipe==='hewan'){
      state.jumlah = 6;              // tap dadu hewan = main penuh 7 dadu
    } else {
      state.jumlah = Array.prototype.indexOf.call(dice, el) + 1;  // tap dadu ke-k = main k angka
    }
    renderMeja();
    roll();
  });

  // init: tampil 7 dadu (6 angka + hewan), diam
  renderMeja();
})();
</script>
</body>
</html>
